<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="padding: 60px 0; background-color: #f4f4f5;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.06); overflow: hidden; margin: 0 20px;">
                    <tr>
                        <td style="padding: 48px 48px 0 48px; text-align: center;">
                            <div style="display: inline-block; padding: 6px 16px; background-color: #f4f4f5; border-radius: 999px; font-size: 11px; font-weight: 700; color: #a1a1aa; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 24px;">
                                动 态 更 新
                            </div>
                            <h2 style="margin: 0; font-family: Georgia, 'Times New Roman', Times, serif; font-size: 24px; font-style: italic; color: #18181b; font-weight: normal;">
                                ${siteName}
                            </h2>
                            <div style="margin-top: 16px; width: 32px; height: 1px; background-color: #e4e4e7; display: inline-block;"></div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px 48px 56px 48px;">
                            <h1 style="margin: 0 0 24px 0; font-size: 24px; line-height: 1.5; color: #18181b; font-weight: 600; text-align: center;">
                                ${postTitle}
                            </h1>
                            <div style="border-left: 3px solid #18181b; padding-left: 20px; margin: 0 0 40px 0;">
                                <p style="margin: 0; font-size: 15px; line-height: 1.8; color: #52525b; font-weight: 300;">
                                    ${postExcerpt}
                                </p>
                            </div>
                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="center">
                                        <a href="${postUrl}" style="display: inline-block; padding: 16px 36px; background-color: #18181b; color: #ffffff; text-decoration: none; border-radius: 9999px; font-size: 13px; font-weight: 600; letter-spacing: 1px;">
                                            前往 ${siteName}.com 查看完整动态
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color: #fafafa; border-top: 1px solid #f4f4f5; padding: 40px 48px; text-align: center;">
                            <p style="margin: 0 0 16px 0; font-size: 12px; color: #a1a1aa; line-height: 1.6;">
                                本通知由底座服务 <span style="font-weight: 600; color: #71717a;">NoticeHub</span> 提供推送能力。<br>
                                您接收到此邮件是因为您曾在 <strong style="color: #71717a;">${siteName}</strong> 留下了您的订阅邮箱。
                            </p>
                            <a href="${unsubscribeUrl}" style="font-size: 12px; color: #71717a; text-decoration: underline;">退订此动态通知</a>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
