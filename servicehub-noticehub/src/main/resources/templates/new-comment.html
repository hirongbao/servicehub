<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
</head>
<body style="margin: 0; padding: 0; background-color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="padding: 40px 0; background-color: #f4f4f5;">
        <tr>
            <td align="center">
                <table width="500" cellpadding="0" cellspacing="0" border="0" style="background-color: #ffffff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; margin: 0 20px;">
                    <tr>
                        <td style="padding: 30px 40px; border-bottom: 1px solid #f4f4f5; background-color: #ffffff;">
                            <div style="font-size: 14px; font-weight: 700; color: #18181b; letter-spacing: -0.5px;">NoticeHub <span style="color: #a1a1aa; font-weight: 400;">/ 审核中心</span></div>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 40px;">
                            <h2 style="margin: 0 0 16px 0; font-size: 20px; color: #18181b; font-weight: 600;">新访客评论</h2>
                            <p style="margin: 0 0 30px 0; font-size: 14px; color: #52525b; line-height: 1.6;">
                                您的动态 <strong style="color: #18181b; font-weight: 600;">${postTitle}</strong> 收到了一条新评论，目前处于待审核状态。
                            </p>
                            <div style="margin-bottom: 30px;">
                                <div style="font-size: 13px; font-weight: 600; color: #18181b; margin-bottom: 8px;">${author} <span style="font-weight: 400; color: #a1a1aa; font-family: monospace; margin-left: 8px;">${ipAddress}</span></div>
                                <div style="background-color: #fafafa; border-left: 3px solid #18181b; padding: 16px 20px; border-radius: 0 8px 8px 0;">
                                    <div style="font-family: Georgia, 'Times New Roman', Times, serif; font-size: 15px; color: #3f3f46; line-height: 1.8; font-style: italic;">
                                        ${commentContent}
                                    </div>
                                </div>
                            </div>
                            <table width="100%" cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="left">
                                        <a href="https://admin.hirongbao.com/#comments" style="display: inline-block; padding: 14px 28px; background-color: #18181b; color: #ffffff; text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: 600; letter-spacing: 0.5px;">
                                            登录后台审核
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="background-color: #fafafa; padding: 24px 40px; text-align: center; border-top: 1px solid #f4f4f5;">
                            <p style="margin: 0; font-size: 12px; color: #a1a1aa;">
                                内部管理通知由 <strong style="color: #71717a;">NoticeHub</strong> 自动投递。<br>请勿直接回复此邮件。
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
