spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  application:
    name: servicehub
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/servicehub?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    # 存量库已有全部表结构：首启时打基线到 2（V1/V2 不再执行），只应用之后的增量迁移
    baseline-on-migrate: true
    baseline-version: 2
server:
  address: 127.0.0.1
  port: 8080

# 日志输出到项目 logs 目录，按实例端口分文件，滚动归档保留 7 天
logging:
  file:
    name: logs/servicehub-${server.port}.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/servicehub-${server.port}.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      total-size-cap: 200MB
      max-history: 7
      clean-history-on-start: true
servicehub:
  timezone: Asia/Shanghai
  admin:
    username: ${SERVICEHUB_ADMIN_USERNAME:hirongbao}
    password: ${SERVICEHUB_ADMIN_PASSWORD:}
    secret: ${SERVICEHUB_AUTH_SECRET:}
  cos:
    secret-id: ${COS_SECRET_ID:}
    secret-key: ${COS_SECRET_KEY:}
    region: ${COS_REGION:ap-shanghai}
    bucket: ${COS_BUCKET:}
    public-url-enabled: ${COS_PUBLIC_URL_ENABLED:true}
  file:
    allowed-content-types: image/jpeg,image/png,image/gif,image/webp
    max-size: 10485760
  link:
    base-url: ${SERVICEHUB_LINK_BASE_URL:}
