services:
  mysql:
    image: mysql:8.4
    container_name: servicehub-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in the environment}
      MYSQL_DATABASE: servicehub
      TZ: Asia/Shanghai
    volumes:
      - servicehub-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  servicehub-mysql-data:
