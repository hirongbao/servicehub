services:
  mysql:
    image: mysql:8.4
    container_name: servicehub-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in the environment}
      MYSQL_DATABASE: servicehub
      TZ: Asia/Shanghai
    volumes:
      - servicehub-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.2-alpine
    container_name: servicehub-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSROD:?REDIS_PASSROD must be set in the environment}
    volumes:
      - servicehub-redis-data:/data

volumes:
  servicehub-mysql-data:
  servicehub-redis-data:
