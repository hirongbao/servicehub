name: ServiceHub Backend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: servicehub-backend-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build backend
        run: mvn -pl servicehub-admin -am clean package -DskipTests

      - name: Trigger server deployment
        if: github.event_name == 'push'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/servicehub_deploy
          chmod 600 ~/.ssh/servicehub_deploy
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          timeout 360 ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            -i ~/.ssh/servicehub_deploy "$SERVER_USER@$SERVER_HOST" '
            cat /opt/scripts/deploy-servicehub-backend.sh > /opt/apps/servicehub-admin/current/dist/deploy-backend-script.txt 2>/dev/null || true
            for i in 1 2 3 4 5; do
              echo "=== 部署尝试第 $i 次 ==="
              if /opt/scripts/deploy-servicehub-backend.sh; then
                echo "=== 后端部署成功！==="
                exit 0
              fi
              echo "第 $i 次拉取/部署失败，等待 5 秒后重试..."
              sleep 5
            done
            echo "连续 5 次重试均失败，终止部署"
            exit 1
          '