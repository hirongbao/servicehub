name: ServiceHub Backend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: servicehub-backend-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify build
        run: mvn -pl servicehub-admin -am clean package -DskipTests

      - name: Prepare source archive
        if: github.event_name == 'push'
        run: git archive --format=tar.gz -o /tmp/backend-source.tar.gz HEAD

      - name: Deploy to server
        if: github.event_name == 'push'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/servicehub_deploy
          chmod 600 ~/.ssh/servicehub_deploy
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # 1. 直传 48KB 极小源码压缩包至服务器（无需让国内服务器连 GitHub，也无需跨国传输 46MB 大包）
          scp -o BatchMode=yes -o StrictHostKeyChecking=no \
            -i ~/.ssh/servicehub_deploy \
            /tmp/backend-source.tar.gz \
            "$SERVER_USER@$SERVER_HOST:/tmp/backend-source.tar.gz"

          # 2. 服务器端解压、复用本地 Maven 依赖快速编译打包、原子切换软链并重启
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no \
            -i ~/.ssh/servicehub_deploy "$SERVER_USER@$SERVER_HOST" '
            set -euo pipefail
            APP_ROOT="/opt/apps/servicehub"
            SOURCE_DIR="$APP_ROOT/source"
            RELEASE_DIR="$APP_ROOT/releases/$(date +%Y%m%d%H%M%S)"

            exec 9>"$APP_ROOT/deploy.lock"
            flock -n 9 || { echo "another backend deployment is already running"; exit 1; }

            mkdir -p "$SOURCE_DIR"
            tar -xzf /tmp/backend-source.tar.gz -C "$SOURCE_DIR"
            rm -f /tmp/backend-source.tar.gz

            cd "$SOURCE_DIR"
            mvn -pl servicehub-admin -am clean package -DskipTests -q

            JAR_PATH=$(find servicehub-admin/target -maxdepth 1 -type f -name "servicehub-admin-*.jar" ! -name "*-plain.jar" | head -n 1)
            test -n "$JAR_PATH"

            mkdir -p "$RELEASE_DIR"
            cp "$JAR_PATH" "$RELEASE_DIR/servicehub-admin.jar"
            ln -sfn "$RELEASE_DIR" "$APP_ROOT/current"

            systemctl --user daemon-reload
            systemctl --user restart servicehub-backend.service

            for i in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
                echo "backend deployment succeeded"
                exit 0
              fi
              sleep 2
            done

            echo "backend health check failed" >&2
            systemctl --user status servicehub-backend.service --no-pager >&2 || true
            journalctl --user -u servicehub-backend.service -n 80 --no-pager >&2 || true
            exit 1
          '