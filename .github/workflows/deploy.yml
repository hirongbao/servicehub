name: ServiceHub Backend CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: servicehub-backend-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify build
        run: mvn -pl servicehub-admin -am clean package -DskipTests

      - name: Prepare source archive
        if: github.event_name == 'push'
        run: |
          mkdir -p /tmp/exploded
          JAR_PATH=$(find servicehub-admin/target -maxdepth 1 -type f -name "servicehub-admin-*.jar" ! -name "*-plain.jar" | head -n 1)
          unzip -q "$JAR_PATH" -d /tmp/exploded

      - name: Deploy to server
        if: github.event_name == 'push'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/servicehub_deploy
          chmod 600 ~/.ssh/servicehub_deploy
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          
          # 0. 提前在服务器端利用现有的 jar 解压出依赖缓存！
          # 这样第一次 rsync 也不需要跨国传输 46MB，直接复用服务器本地的历史依赖库。
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/servicehub_deploy "$SERVER_USER@$SERVER_HOST" '
            mkdir -p /opt/apps/servicehub/sync_cache
            if [ -f /opt/apps/servicehub/current/servicehub-admin.jar ] && [ ! -d /opt/apps/servicehub/sync_cache/BOOT-INF ]; then
              unzip -q /opt/apps/servicehub/current/servicehub-admin.jar -d /opt/apps/servicehub/sync_cache/ || true
            fi
          '
          
          # 1. 增量直传解压后的包体。因为 99% 都是没变的第三方 jar，实际每次只会传几百 KB 的 class 文件，极快！
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/servicehub_deploy "$SERVER_USER@$SERVER_HOST" "mkdir -p /opt/apps/servicehub/sync_cache"
          
          rsync -az --delete -e "ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/servicehub_deploy" \
            /tmp/exploded/ \
            "$SERVER_USER@$SERVER_HOST:/opt/apps/servicehub/sync_cache/"

          # 2. 服务器端只需要执行极速的零压缩封包，避免了 Maven 重度消耗内存导致的几分钟卡顿
          ssh -o BatchMode=yes -o StrictHostKeyChecking=no -i ~/.ssh/servicehub_deploy "$SERVER_USER@$SERVER_HOST" '
            set -euo pipefail
            APP_ROOT="/opt/apps/servicehub"
            RELEASE_DIR="$APP_ROOT/releases/$(date +%Y%m%d%H%M%S)"

            exec 9>"$APP_ROOT/deploy.lock"
            flock -n 9 || { echo "another backend deployment is already running"; exit 1; }

            mkdir -p "$RELEASE_DIR"
            cd "$APP_ROOT/sync_cache"
            
            # 使用 jar 命令打包 (0 表示不压缩存储，这是 Spring Boot 嵌套 jar 所必需的要求)
            jar -c0Mf "$RELEASE_DIR/servicehub-admin.jar" .

            ln -sfn "$RELEASE_DIR" "$APP_ROOT/current"

            systemctl --user daemon-reload
            systemctl --user restart servicehub-backend.service

            for i in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
                echo "backend deployment succeeded"
                exit 0
              fi
              sleep 2
            done

            echo "backend health check failed" >&2
            systemctl --user status servicehub-backend.service --no-pager >&2 || true
            journalctl --user -u servicehub-backend.service -n 80 --no-pager >&2 || true
            exit 1
          '